services:
  db:
    image: postgres:16-alpine
    container_name: sohnic-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: sohnic_user
      POSTGRES_PASSWORD: sohnic_pass
      POSTGRES_DB: sohnic
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sohnic-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sohnic_user -d sohnic']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: development
    container_name: sohnic-app
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sohnic-network

volumes:
  postgres-data:
    name: sohnic-postgres-data
    driver: local

networks:
  sohnic-network:
    driver: bridge
