services:
  db:
    image: postgres:16-alpine
    container_name: sohnic-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: sohnic_user
      POSTGRES_PASSWORD: sohnic_pass
      POSTGRES_DB: sohnic
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sohnic-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sohnic_user -d sohnic']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sohnic-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sohnic.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - sohnic-network
    depends_on:
      - db
  app:
    build:
      context: .
      target: development
    container_name: sohnic-app
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sohnic-network

volumes:
  postgres-data:
    name: sohnic-postgres-data
    driver: local
  pgadmin-data:
    name: sohnic-pgadmin-data
    driver: local

networks:
  sohnic-network:
    driver: bridge
